# ==============================================================================
# NeuralDesk — Render Infrastructure-as-Code Blueprint
# Deploys API backend container on Render Free Tier with PostgreSQL and Health Checks.
# ==============================================================================

services:
  - type: web
    name: neuraldesk-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: neuraldesk-postgres
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: CORS_ORIGIN
        value: https://neuraldesk.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-1.5-flash
      - key: MAX_CONCURRENT_EXECUTIONS
        value: "3"
      - key: EXECUTION_TIMEOUT_MS
        value: "30000"

databases:
  - name: neuraldesk-postgres
    plan: free
    databaseName: neuraldesk_prod
    user: neuraldesk_admin
    region: oregon
